[package]
name = "writer-deck"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Writer Deck — coeur Rust : noms, chemins, notes, configuration, anti-boucle"
license = "MIT"
publish = false

[lib]
name = "writer_deck"
path = "src/lib.rs"

# Le binaire Tauri est une cible OPTIONNELLE : il exige les libs systeme
# GTK/WebKit, absentes de la plupart des machines de dev.
#   cargo test                 -> compile et teste la lib seule (aucune lib GTK requise)
#   cargo build --features app -> compile le binaire Tauri (libs GTK necessaires)
[features]
default = []
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[[bin]]
name = "writer-deck"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "7"
notify = "8"
trash = "5"

# binaire Tauri (uniquement avec --features app)
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

# tauri-build est un build-dependency SANS CONDITION : generate_context! a besoin de
# OUT_DIR, donc build.rs doit toujours exister. Il est sans dependance GTK, donc
# `cargo test` reste jouable sans libs systeme ; seul l'appel a tauri_build::build()
# est conditionne au feature `app` (cf. build.rs).
[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"