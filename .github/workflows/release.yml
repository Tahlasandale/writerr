name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# seule la release a besoin d'écrire (§9)
permissions:
  contents: write

jobs:
  bundle:
    name: linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: appimage
            required: true
          - target: deb
            required: true
          - target: rpm
            required: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: libs système Linux (§8)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: vérifier la cohérence de version (§5.6)
        run: npm run test:js

      - name: construire ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Writer Deck ${{ github.ref_name }}
          releaseBody: |
            Binaire Linux (${{ matrix.target }}) de Writer Deck.

            Les documents sont des fichiers `.md` dans le dossier de votre choix.
            Voir les notes de version et le panneau « À propos & téléchargements »
            dans l'application.
          releaseDraft: true
          args: --features app --bundles ${{ matrix.target }}

  smoke:
    name: le binaire compile et les tests passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: libs système Linux (§8)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: construire le binaire sans empaquetage (§8)
        run: cargo build --features app --release --bin writer-deck
        working-directory: src-tauri
      - name: taille du binaire (< 15 Mo, §10)
        run: |
          ls -lh target/release/writer-deck
          size=$(stat -c%s target/release/writer-deck)
          echo "taille: $size octets"
          test "$size" -lt 15728640 || (echo "binaire trop volumineux"; exit 1)