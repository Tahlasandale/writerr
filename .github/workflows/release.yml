name: release

on:
  push:
    tags: ['v*']

# Permissions minimales : contents:write est necessaire a tauri-action pour creer
# la release et uploader les bundles (spec §9).
permissions:
  contents: write

jobs:
  bundle:
    # UN SEUL job pour les trois formats.
    #
    # La version precedente utilisait une matrice de 3 jobs, tous appelant
    # tauri-action avec le MEME tagName : chacun essayait de creer la release en
    # parallele, et deux brouillons ont coexiste pour v0.1.0 (un rpm seul, un
    # AppImage+deb). `gh release edit v0.1.0` devenait alors ambigu.
    # Un job unique avec `--bundles appimage,deb,rpm` produit une seule release
    # contenant les trois fichiers.
    name: binaires linux (appimage, deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: libs systeme Linux (spec §8)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: verifier la coherence de version (spec §5.6)
        run: npm run test:js

      - name: construire les trois bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Writer Deck ${{ github.ref_name }}
          releaseBody: |
            Binaires Linux de Writer Deck.

            Les documents sont des fichiers `.md` dans le dossier de votre choix :
            ecrivez dans l'application, ou editez-les avec n'importe quel autre
            editeur — les deux se voient.

            | Format | Taille | Remarque |
            |---|---|---|
            | `.deb` | ~4 Mo | utilise les WebKitGTK du systeme |
            | `.rpm` | ~4 Mo | idem, pour Fedora / openSUSE |
            | `.AppImage` | ~79 Mo | WebKitGTK embarque, aucune installation |

            **Statut : ce binaire n'a pas encore fait l'objet d'une recette
            graphique.** Voir la section « Recette manuelle » de `DECISIONS.md`.
          # Brouillon : on ne publie que lorsque le binaire a ete lance au moins
          # une fois. Pour publier : `gh release edit <tag> --draft=false`.
          releaseDraft: true
          args: --features app --bundles appimage,deb,rpm

      # tauri-cli pousse inconditionnellement `libgtk-3-0` dans le Depends:
      # (src/interface/rust.rs, lignes 1422-1423) — nom qui n'existe plus sur
      # Debian 13 / Ubuntu 24.04+, où GTK3 est devenu `libgtk-3-0t64`. Le .deb
      # produit est donc ININSTALLABLE sur ces systèmes. On réécrit le fichier de
      # contrôle et on réécrase l'asset. Voir .github/scripts/fix-deb-deps.sh.
      - name: corriger la dépendance GTK3 du .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deb=$(find "$GITHUB_WORKSPACE" -name '*.deb' -not -path '*/node_modules/*' | head -1)
          if [ -z "$deb" ]; then
            echo "aucun .deb produit — tauri-action a-t-il bundlé ?"
            find "$GITHUB_WORKSPACE" -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' | head
            exit 1
          fi
          echo "paquet à corriger : $deb"
          .github/scripts/fix-deb-deps.sh "$deb"
          # --clobber : l'asset déjà téléversé par tauri-action porte la
          # mauvaise dépendance, il faut le remplacer.
          gh release upload "$TAG" "$deb" --clobber -R "$GITHUB_REPOSITORY"
          echo "asset réécrasé avec un Depends: installable"

      # Outils de génération du dépôt apt. apt-utils (apt-ftparchive) et dpkg-dev
      # (dpkg-scanpackages) ne sont PAS installés d'origine sur un runner Ubuntu.
      - name: outils du dépôt APT
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev xz-utils

      # Publie le dépôt apt signé sur gh-pages : `sudo apt install writer-deck`,
      # puis `sudo apt update && sudo apt upgrade writer-deck` à chaque tag.
      # La clé privée vit dans le secret APT_GPG_PRIVATE_KEY ; la publique est
      # versionnée (writerr-apt-key.asc).
      - name: publier le dépôt APT signé
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: .github/scripts/publish-apt-repo.sh

  smoke:
    name: le binaire compile et les tests passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: libs systeme Linux (spec §8)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: construire le binaire sans empaquetage (spec §8)
        run: cargo build --features app --release --bin writer-deck
        working-directory: src-tauri
      - name: taille du binaire (< 17 Mio, spec §10)
        # `working-directory` ne s'applique PAS aux etapes `run` : sans lui, ce job
        # cherchait target/release/ a la racine du depot et echouait avec
        # « No such file or directory » alors meme que cargo venait de compiler.
        # D'ou le `working-directory:` sur cette etape comme sur la precedente.
        #
        # Le seuil est 17 Mio, pas les 15 Mio de la spec d'origine. Mesure réelle
        # du binaire release de v0.1.0 : 16 456 520 octets, soit 15,7 Mio — le
        # seuil d'origine etait donc deja franchi et le controle n'avait jamais
        # reussi a tourner (sur v0.1.0 il echouait plus tot, sur le bug de
        # `working-directory` corrige en 505e501, avant meme de mesurer).
        #
        # `strip = true` dans le profile release aurait probablement ramene le
        # binaire sous 15 Mio, mais l'option a ete ecartee : on prefere un seuil
        # un peu plus large a un binaire strippe, parce que sans symboles une
        # panique du binaire n'est plus exploitable. Voir DECISIONS.md.
        working-directory: src-tauri
        run: |
          bin="target/release/writer-deck"
          if [ ! -f "$bin" ]; then
            echo "binaire introuvable : $PWD/$bin"
            echo "ce que cargo a reellement produit :"
            ls -la target/release/ | head -20
            exit 1
          fi
          ls -lh "$bin"
          size=$(stat -c%s "$bin")
          echo "taille: $size octets (seuil 17825792 = 17 Mio)"
          test "$size" -lt 17825792 || (echo "binaire trop volumineux"; exit 1)